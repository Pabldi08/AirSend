name: Native Windows

on:
  pull_request:
    paths:
      - 'native/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'src-tauri/icons/**'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      AIRSEND_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test the shared engine
        run: cargo test --locked -p airsend-engine
      - name: Publish native x64 application
        run: dotnet publish native/AirSend.csproj -c Release -p:Platform=x64 --self-contained true -o target/native-publish
      - uses: actions/upload-artifact@v4
        with:
          name: AirSend-WinUI-x64
          path: target/native-publish
          if-no-files-found: error
