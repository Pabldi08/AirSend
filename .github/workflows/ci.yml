name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      AIRSEND_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: UI regression tests
        run: npm --prefix ui run test:devices
      - name: Build UI
        run: npm --prefix ui run build
      - name: Rust regression tests
        run: cargo test --workspace --all-targets --locked
      - name: Build test installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis -- --locked
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: AirSend-Windows-test-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
