[package]
name = "cap-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cap_core"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
mdns-sd = { workspace = true }
async-trait = "0.1"
uuid = "1"
base64 = "0.22"

# Reviewed DavidTIBO/airplay2-rs revision 9edef328, vendored with local clock
# validation/regression fixes. Provenance and original license are retained in
# vendor/airplay2-rs. All aliases resolve to the same vendored workspace.
ap2rs-pairing = { package = "airplay-pairing", path = "../../vendor/airplay2-rs/crates/airplay-pairing" }
ap2rs-core = { package = "airplay-core", path = "../../vendor/airplay2-rs/crates/airplay-core" }
ap2rs-client = { package = "airplay-client", path = "../../vendor/airplay2-rs/crates/airplay-client" }
ap2rs-audio = { package = "airplay-audio", path = "../../vendor/airplay2-rs/crates/airplay-audio" }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[example]]
name = "probe_cli"
path = "examples/probe_cli.rs"

[[example]]
name = "pair_cli"
path = "examples/pair_cli.rs"

[[example]]
name = "tone_cli"
path = "examples/tone_cli.rs"

[[example]]
name = "stream_cli"
path = "examples/stream_cli.rs"
required-features = []

[dev-dependencies.audio-capture]
path = "../audio-capture"

[dev-dependencies.crossbeam-channel]
version = "0.5"

[dependencies.ap2rs-discovery]
package = "airplay-discovery"
path = "../../vendor/airplay2-rs/crates/airplay-discovery"
