[package]
name = "cap-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cap_core"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
mdns-sd = { workspace = true }
async-trait = "0.1"

# Reutilizamos el sender AirPlay 2 alpha de lmcgartland/airplay2-rs
# (GPL-3.0-or-later).
# Apuntamos a nuestro fork `Pabldi08/airplay2-rs` con un parche mínimo
# (`set_socket_qos` gated detrás de `#[cfg(unix)]`, stub en Windows, y prioridad
# MMCSS correcta para el sender) porque el upstream no compila en MSVC tal cual.
# Renombramos los paquetes para no colisionar con nuestro crate local (también
# llamado airplay-core en el repo upstream).
ap2rs-pairing = { package = "airplay-pairing", git = "https://github.com/Pabldi08/airplay2-rs", rev = "dc66e2b3df1ad87a34fd9c859ec452bd787154e1" }
ap2rs-core = { package = "airplay-core", git = "https://github.com/Pabldi08/airplay2-rs", rev = "dc66e2b3df1ad87a34fd9c859ec452bd787154e1" }
ap2rs-client = { package = "airplay-client", git = "https://github.com/Pabldi08/airplay2-rs", rev = "dc66e2b3df1ad87a34fd9c859ec452bd787154e1" }
ap2rs-audio = { package = "airplay-audio", git = "https://github.com/Pabldi08/airplay2-rs", rev = "dc66e2b3df1ad87a34fd9c859ec452bd787154e1" }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[example]]
name = "probe_cli"
path = "examples/probe_cli.rs"

[[example]]
name = "pair_cli"
path = "examples/pair_cli.rs"

[[example]]
name = "tone_cli"
path = "examples/tone_cli.rs"

[[example]]
name = "stream_cli"
path = "examples/stream_cli.rs"
required-features = []

[dev-dependencies.audio-capture]
path = "../audio-capture"

[dev-dependencies.crossbeam-channel]
version = "0.5"

[dependencies.ap2rs-discovery]
package = "airplay-discovery"
git = "https://github.com/Pabldi08/airplay2-rs"
rev = "dc66e2b3df1ad87a34fd9c859ec452bd787154e1"
